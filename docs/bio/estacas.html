<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>BIO Estacas</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
	<style>
* {
	box-sizing: border-box;
}
body {
	position: relative;
	width: 100vh;
	height: 100vh;
	border:1px solid green;
	font-size: 5vh;
	margin: 0;
	font-family: "Montserrat", sans-serif;
	font-optical-sizing: auto;
	font-weight: 100;
	font-style: normal;
	text-align: center;
	color: #8f1637;
}
@media screen and (orientation: portrait) {
	body {
		width: 100vw;
		height: 100vw;
		font-size: 5vw;
	}
}
header {
	width:100%;
	height:3em;
}
header .macan, header .bio {
	width:2.2em;
	height:2.2em;
	margin: 0.4em;
}
header .macan {
	float: left;
}
header .bio {
	float: right;
}
footer {
	position: absolute;
	bottom: 0;
	left: 0;
	width: 100%;
	height: 1.5em;
}
footer .macan {
	float: left;
	width:1.1em;
	height:1.1em;
	margin: 0 0.4em 0.4em 0.4em;/* ^ > v < */
}
.l {
	left:0;
	right:0;
	position: absolute;
	height: 0.05em;
	background-color: #cfcfcf;
}
.t1, .t2 {
	margin:0;
	color:#17401f;
	font-weight: 400;
	font-size: 0.45em;
	padding-top: 0.5em;
}
.t1 {
	float: left;
}
.t2 {
	padding-right: 1em; 
	float: right;
}

h1, h2 {
	font-style: normal;
	margin:0;
	padding:0;
}
h2 {
	padding-top: 1em;
	font-weight: 400;
	font-size: 0.6em;
}
h1 {
	font-weight: 800;
	font-size: 1.2em;
}
.props {
	position: absolute;
	right: 1.2em;
	top: 5em;
	width: 5em;
}
.prop {
	position: relative;
	width: 100%;
	height: 3em;
	margin-top: 0.5em;
	/*border:1px solid green;*/
}
.prop .bl {
	width: 0.9em;
	height: 0.9em;
}
.prop .name {
	position: absolute;
	width: calc(100% - 2.8em);
	right: 0;
	top: 0;
	font-size: 0.5em;
	text-align: left;
	font-weight: 400;
	color: #5e5e5e;
}
.prop h3 {
	margin: 0;
	padding: 0.2em;
	font-size: 1.2em;
	font-weight: 600;
}
#graph {
	z-index: -1;
	position: absolute;
	left: 1.5em;
	top: 5.5em;
	width: 11em;
	height: 11em;
}
.graph-value {
	position: absolute;
	left: 1.5em;
	width: 11em;
	top: 9.8em;
}
.graph-value p {
	color: #5e5e5e;
	font-size: 0.4em;
	font-weight: 500;
	padding: 0;
	margin: 0;
}
.graph-value h3 {
	font-size: 1em;
	font-weight: 600;
	padding: 0;
	margin: 0;
}
	</style>
	<script>
const estacas = 214;
function main () {
	let executadas = (new URLSearchParams(window.location.search)).get('exec');
	const props = Array.from(document.body.querySelector(".props").querySelectorAll('.prop'));
	props[0].querySelector('h3').innerText = executadas;
	props[1].querySelector('h3').innerText = estacas - executadas;
	props[2].querySelector('h3').innerText = estacas;

	let porc_executadas = (executadas/estacas*100.0).toFixed(1).replace('.',',')+'%';
	let porc_nexecutadas = ((1.0 - executadas/estacas)*100.0).toFixed(1).replace('.',',')+'%';
	document.body.querySelector('.graph-value').querySelector('h3').innerText = porc_executadas;

	const canvas = document.getElementById('graph');// as HTMLCanvasElement;
	const resolucao = canvas.clientWidth;
	const hr = resolucao /2;
	const chr = hr*0.55;
	const rtexto = (hr+chr)*0.5;
	canvas.height = resolucao;
	canvas.width = resolucao;
	const ctx = canvas.getContext("2d");
	function arco(i, e) {
		i=i *2*Math.PI-Math.PI/2;
		e=e *2*Math.PI-Math.PI/2;
		ctx.beginPath();
		ctx.arc(hr,hr,hr-2, i, e);
		ctx.arc(hr,hr,chr, e, i, true);
		ctx.closePath();
		ctx.fill();
	}
	ctx.fillStyle='#8f1637';
	arco(0, executadas/estacas);
	ctx.fillStyle='#cfcfcf';
	arco(executadas/estacas, 0);
	ctx.strokeStyle='white';
	ctx.lineWidth = 2;
	ctx.stroke();

	ctx.font = (resolucao*0.05).toFixed(0)+"px Verdana";
	ctx.textBaseline="middle";
	ctx.textAlign="center";
	function texto(valor, angle) {
		angle *= 2*Math.PI;
		let x = hr + Math.sin(angle)*rtexto;
		let y = hr - Math.cos(angle)*rtexto;
		ctx.fillText(valor, x, y);
	}
	ctx.fillStyle='white';
	texto (porc_executadas, executadas/(estacas*2));
	ctx.fillStyle='#5e5e5e';
	texto (porc_nexecutadas, - (1.0 - (executadas/estacas)) * 0.5);

	const agora = new Date(Date.now());
	
	
	document.body.querySelector('.t2').innerText = ([
		"JANEIRO",
		"FEVEREIRO",
		"MARÇO",
		"ABRIL",
		"MAIO",
		"JUNHO",
		"JULHO",
		"AGOSTO",
		"SETEMBRO",
		"OUTUBRO",
		"NOVEMBRO",
		"DEZEMBRO"
	])[agora.getMonth()]+"/"+agora.getFullYear();
}
addEventListener("load", main);
	</script>
</head>
<body>
	<header>
		<img class="macan" src="./rsc/macan.png"/>
		<img class="bio" src="./rsc/bio.png"/>
		<h2>PROGRESSO DE EXECUÇÃO</h2>
		<h1>ESTACAS</h1>
	</header>
	<footer>
		<div class="l" style="left: 2em; right: 0.4em;"></div>
		<img class="macan" src="./rsc/macan.png"/>
		<p class="t1">BIO PETRÓPOLIS</p>
		<p class="t2">--/--</p>
	</footer>
	<div class="props">
		<div class="prop">
			<div class="bl" style="background-color: #8f1637;"></div>
			<div class="name">ESTACAS CONCRETADAS</div>
			<h3>--</h3>
		</div>
		<div class="l"></div>
		<div class="prop">
			<div class="bl" style="background-color: #cfcfcf;"></div>
			<div class="name">ESTACAS RESTANTES</div>
			<h3 style="color: #5e5e5e;">--</h3>
		</div>
		<div class="l"></div>
		<div class="prop">
			<div class="bl"></div>
			<div class="name">ESTACAS CONCRETADAS</div>
			<h3>--</h3>
		</div>
	</div>
	<canvas id="graph">
		
	</canvas>
	<div class="graph-value">
		<p>EXECUÇÃO TOTAL</p>
		<h3>52,3%</h3>
		<p>CONCLUIDO</p>
	</div>
</body>
</html>
